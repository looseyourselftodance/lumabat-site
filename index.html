<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMABAT — Construire l'Exception</title>
  <meta name="description" content="LUMABAT — Construction de maisons d'exception à Toulouse. Construire l'Exception." />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark: #1A1A1A;
      --bronze-light: #C4A882;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--dark);
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #scrubCanvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.9);
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #stage.ready #scrubCanvas { opacity: 1; }

    .progress-track {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 2px; background: rgba(248,247,244,0.12);
      z-index: 50;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: var(--bronze-light);
    }

    .loading-label {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      font-family: sans-serif;
      font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: rgba(248,247,244,0.55);
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body>

<div id="stage">
  <canvas id="scrubCanvas"></canvas>
</div>
<div class="loading-label" id="loadingLabel">Loading…</div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

<script>
  // ── Unified scroll-scrubbed sequence ──
  // The page itself never scrolls (fixed, full-viewport). Wheel / touch input
  // moves a virtual position through ONE merged sequence built from all 11 clips.
  // Scroll down / swipe up = forward. Scroll up / swipe down = backward.

  const VIDEO_FRAMES = [
    { folder: 'videos/frames/01/', count: 80 },
    { folder: 'videos/frames/02/', count: 160 },
    { folder: 'videos/frames/03/', count: 160 },
    { folder: 'videos/frames/04/', count: 8 },
    { folder: 'videos/frames/05/', count: 160 },
    { folder: 'videos/frames/06/', count: 8 },
    { folder: 'videos/frames/07/', count: 64 },
    { folder: 'videos/frames/08/', count: 64 },
    { folder: 'videos/frames/09/', count: 80 },
    { folder: 'videos/frames/10/', count: 8 },
    { folder: 'videos/frames/11/', count: 120 },
  ];

  // How many px of wheel delta it takes to advance one frame.
  // Lower = faster/twitchier, higher = slower/more cinematic.
  const SENSITIVITY = 0.4;
  const TOUCH_MULTIPLIER = 2.2;

  const frameUrls = [];
  VIDEO_FRAMES.forEach((v) => {
    for (let i = 1; i <= v.count; i++) {
      frameUrls.push(v.folder + String(i).padStart(4, '0') + '.jpg');
    }
  });
  const totalFrames = frameUrls.length;

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('scrubCanvas');
  const ctx = canvas.getContext('2d');
  const loadingLabel = document.getElementById('loadingLabel');
  const progressFill = document.getElementById('progressFill');

  const images = new Array(totalFrames);
  let loadedCount = 0;
  let firstFrameReady = false;

  frameUrls.forEach((url, i) => {
    const img = new Image();
    img.onload = () => {
      loadedCount++;
      if (i === 0) {
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        firstFrameReady = true;
        stage.classList.add('ready');
        loadingLabel.style.opacity = '0';
        renderFrame(0);
      }
    };
    img.src = url;
    images[i] = img;
  });

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  let virtualPos = 0;
  let currentDrawn = -1;
  let renderScheduled = false;

  function applyDelta(deltaFrames) {
    virtualPos = clamp(virtualPos + deltaFrames, 0, totalFrames - 1);
    requestRender();
  }

  function requestRender() {
    if (renderScheduled) return;
    renderScheduled = true;
    requestAnimationFrame(() => renderFrame(Math.round(virtualPos)));
  }

  function renderFrame(idx) {
    renderScheduled = false;
    if (!firstFrameReady) return;
    if (idx === currentDrawn) return;
    const img = images[idx];
    if (img && img.complete && img.naturalWidth) {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      currentDrawn = idx;
      progressFill.style.width = ((idx + 1) / totalFrames * 100) + '%';
    } else {
      requestRender();
    }
  }

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    applyDelta(e.deltaY * SENSITIVITY);
  }, { passive: false });

  let touchStartY = null;
  window.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (touchStartY === null) return;
    const y = e.touches[0].clientY;
    const delta = touchStartY - y;
    touchStartY = y;
    e.preventDefault();
    applyDelta(delta * TOUCH_MULTIPLIER * SENSITIVITY);
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') applyDelta(40 * SENSITIVITY);
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') applyDelta(-40 * SENSITIVITY);
  });
</script>

</body>
</html>
