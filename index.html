<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMABAT — Construire l'Exception</title>
  <meta name="description" content="LUMABAT — Construction de maisons d'exception à Toulouse. Construire l'Exception." />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark: #1A1A1A;
      --bronze-light: #C4A882;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--dark);
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .clip {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.9);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .clip.active { opacity: 1; z-index: 2; }

    .progress-track {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 2px; background: rgba(248,247,244,0.12);
      z-index: 50;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: var(--bronze-light);
    }

    .loading-label {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      font-family: sans-serif;
      font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: rgba(248,247,244,0.55);
      transition: opacity 0.4s ease;
    }

    /* ── Checkpoint caption (placeholder copy — draft pass) ── */
    .checkpoint-text {
      position: fixed; left: 50%; bottom: 14%;
      transform: translate(-50%, 16px);
      z-index: 60; text-align: center;
      max-width: 620px; width: 84%;
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .checkpoint-text.visible { opacity: 1; transform: translate(-50%, 0); }
    .checkpoint-text .cp-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--bronze-light); margin-bottom: 0.9rem;
    }
    .checkpoint-text .cp-body {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.3rem, 3vw, 2.1rem);
      font-weight: 300; line-height: 1.4;
      color: #F8F7F4;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }
    .checkpoint-text .cp-hint {
      margin-top: 1.6rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: rgba(248,247,244,0.4);
    }
  </style>
</head>
<body>

<div id="stage">
  <video class="clip active" data-index="0" src="videos/01.mp4" muted playsinline preload="auto"></video>
  <video class="clip" data-index="1" src="videos/02.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="2" src="videos/03.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="3" src="videos/04.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="4" src="videos/05.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="5" src="videos/06.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="6" src="videos/07.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="7" src="videos/08.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="8" src="videos/09.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="9" src="videos/10.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="10" src="videos/11.mp4" muted playsinline preload="none"></video>
  <!-- Reversed twins: same content, frames in reverse order. Playing these
       forward looks exactly like the original playing backward — genuine
       native decode either way, since <video> has no reverse playbackRate.
       Only clip 0's pair preloads eagerly; the rest warm up dynamically as
       we approach them (see warmAround() in the script) — keeping only a
       handful of the 22 files buffered at once instead of all of them
       fighting for decode/network bandwidth simultaneously. -->
  <video class="clip" data-index="0" data-rev src="videos/01r.mp4" muted playsinline preload="auto"></video>
  <video class="clip" data-index="1" data-rev src="videos/02r.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="2" data-rev src="videos/03r.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="3" data-rev src="videos/04r.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="4" data-rev src="videos/05r.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="5" data-rev src="videos/06r.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="6" data-rev src="videos/07r.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="7" data-rev src="videos/08r.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="8" data-rev src="videos/09r.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="9" data-rev src="videos/10r.mp4" muted playsinline preload="none"></video>
  <video class="clip" data-index="10" data-rev src="videos/11r.mp4" muted playsinline preload="none"></video>
</div>
<div class="loading-label" id="loadingLabel">Loading…</div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="checkpoint-text" id="checkpointText">
  <div class="cp-label" id="cpLabel"></div>
  <div class="cp-body" id="cpBody"></div>
  <div class="cp-hint">scroll to continue</div>
</div>

<script>
  // ── Real-video trigger-and-play engine, curated checkpoints ──
  // The page opens at clip 1's first frame — a film waiting to be played.
  // Scroll input never moves anything directly; it accumulates, and once
  // enough has built up ("one good scroll"), it commits to playing straight
  // through to the next (or previous) checkpoint. Checkpoints don't have to
  // sit on clip boundaries — one motion can span multiple clips, switching
  // the active <video> seamlessly as it goes.
  //
  // Backward: <video> has no negative playbackRate, so true reverse
  // playback isn't possible on the forward file. Instead each clip has a
  // pre-rendered reversed twin (frames in reverse order); playing that
  // twin forward looks exactly like the original rewinding, with genuine
  // native decode in both directions.
  //
  // All in-flight state lives in ONE object, `motion` (see below), instead
  // of several separately-tracked flags — fewer places for state to drift
  // out of sync, and the whole tick loop is wrapped in try/catch so a bug
  // here can never again silently kill the animation loop (that's the most
  // likely real explanation for past "freezes": an uncaught error stops
  // requestAnimationFrame from ever being called again, with no visible
  // error to the user).

  const CLIPS = [
    { file: 'videos/01.mp4', duration: 10 },
    { file: 'videos/02.mp4', duration: 20 },
    { file: 'videos/03.mp4', duration: 20 },
    { file: 'videos/04.mp4', duration: 1 },
    { file: 'videos/05.mp4', duration: 20 },
    { file: 'videos/06.mp4', duration: 1 },
    { file: 'videos/07.mp4', duration: 8 },
    { file: 'videos/08.mp4', duration: 8 },
    { file: 'videos/09.mp4', duration: 10 },
    { file: 'videos/10.mp4', duration: 1 },
    { file: 'videos/11.mp4', duration: 15 },
  ];
  const TOTAL_DURATION = CLIPS.reduce((s, c) => s + c.duration, 0);

  // Every checkpoint-to-checkpoint segment takes exactly this many real
  // seconds, no matter how much footage it covers — a short 1s connector
  // clip plays in slow motion, a 30s segment plays back very fast, both
  // land on the next checkpoint at the same pace (capped by MAX_RATE).
  const SEGMENT_SECONDS = 3;

  // Curated checkpoints (clip index is 0-based: clip 0 = videos/01.mp4).
  // `label`/`body` = placeholder caption (null = no pause, just a waypoint).
  // `auto: true` = on arrival, immediately continue to the next checkpoint
  // instead of pausing — used for checkpoint 8's mid-clip auto-advance.
  const CHECKPOINTS = [
    { clip: 0,  time: 0 },                                                                          // 1 — start, no change
    { clip: 0,  time: 10,   label: '01 — L’Arrivée',        body: 'Une terrasse pensée pour l’heure dorée.' },
    { clip: 1,  time: 9.73, label: '02 — La Piscine',       body: 'Là où la cuisine extérieure rencontre l’eau.' },      // sharpest frame near sec 10 of clip 2
    { clip: 2,  time: 20,   label: '03 — Le Séjour',        body: 'Ouvert, lumineux, pensé pour se retrouver.' },
    { clip: 4,  time: 0,    label: '04 — Le Garage',        body: 'Stationnement couvert, à deux pas de la cuisine.' },
    { clip: 6,  time: 0,    label: '05 — La Cuisine',       body: 'Là où la maison prend vie.' },
    { clip: 7,  time: 4.0,  label: '06 — La Salle de Bain', body: 'Douche pluie, lumière naturelle, aucun compromis.' }, // sharpest frame, clip 8, 3.15–4.15s window
    { clip: 7,  time: 6.0,  auto: true },                                                            // 8 — plays 3s→6s of clip 8, then auto-advances, no pause
    { clip: 10, time: 15,   label: '07 — Le Retour',        body: 'De retour au point de départ — la piscine, au crépuscule.' },
  ];

  function elapsedBefore(idx) {
    let s = 0;
    for (let i = 0; i < idx; i++) s += CLIPS[i].duration;
    return s;
  }
  function timelinePos(cp) { return elapsedBefore(cp.clip) + cp.time; }

  // Precompute how much footage (seconds) each checkpoint-to-checkpoint
  // segment covers, so playbackRate can be derived to fit it into
  // SEGMENT_SECONDS.
  const SEGMENT_DURATIONS = [];
  for (let i = 0; i < CHECKPOINTS.length - 1; i++) {
    SEGMENT_DURATIONS.push(timelinePos(CHECKPOINTS[i + 1]) - timelinePos(CHECKPOINTS[i]));
  }
  // Capped at 4x — real video decoders start dropping frames above that,
  // which looks choppy even with genuine native playback. Segments needing
  // more than this (e.g. the ~30s checkpoint 2→3 span) simply take longer
  // than SEGMENT_SECONDS rather than sacrifice smoothness.
  const MAX_RATE = 4;
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
  function segmentRate(a, b) {
    const seg = Math.min(a, b);
    return clamp(SEGMENT_DURATIONS[seg] / SEGMENT_SECONDS, 0.0625, MAX_RATE);
  }

  // How much accumulated scroll (px) is needed to trigger a checkpoint —
  // "one good scroll" — tuned to roughly two or three normal wheel notches.
  const TRIGGER_THRESHOLD = 260;
  const TOUCH_MULTIPLIER = 2.2;
  const IDLE_MS = 150;
  // If a motion's video stops advancing for this long (stalled buffering,
  // failed seek, etc.), force it to complete rather than block input
  // indefinitely.
  const STALL_MS = 1200;

  function clipDuration(i) { return CLIPS[i].duration; }
  // Maps a position in the forward clip's timeline to the equivalent
  // position in its reversed twin's own timeline (frame order is flipped).
  function revTime(clipIdx, t) { return clipDuration(clipIdx) - t; }

  const videos = Array.from(document.querySelectorAll('.clip:not([data-rev])'));
  const videosRev = Array.from(document.querySelectorAll('.clip[data-rev]'));
  const loadingLabel = document.getElementById('loadingLabel');
  const progressFill = document.getElementById('progressFill');
  const checkpointTextEl = document.getElementById('checkpointText');
  const cpLabelEl = document.getElementById('cpLabel');
  const cpBodyEl = document.getElementById('cpBody');

  videos.forEach((v) => { v.playsInline = true; });
  videosRev.forEach((v) => { v.playsInline = true; });

  let ready = false;
  videos[0].addEventListener('loadeddata', () => {
    if (ready) return;
    ready = true;
    loadingLabel.style.opacity = '0';
  }, { once: true });

  // Only clip 0's pair preloads eagerly (see HTML). As activeIndex moves,
  // keep just its immediate neighborhood warm instead of all 22 files at
  // once — cuts decode/network contention that was dragging the framerate
  // down during active playback.
  const warmed = new Array(CLIPS.length).fill(false);
  warmed[0] = true;
  function warmClip(idx) {
    if (idx < 0 || idx >= CLIPS.length || warmed[idx]) return;
    warmed[idx] = true;
    videos[idx].preload = 'auto';
    videos[idx].load();
    videosRev[idx].preload = 'auto';
    videosRev[idx].load();
  }
  function warmAround(idx) {
    warmClip(idx - 1);
    warmClip(idx);
    warmClip(idx + 1);
  }

  let lastProgressPct = -1;
  function updateProgress() {
    const pct = (elapsedBefore(activeIndex) + videoTime) / TOTAL_DURATION * 100;
    if (Math.abs(pct - lastProgressPct) < 0.05) return; // skip redundant layout/paint
    lastProgressPct = pct;
    progressFill.style.width = pct + '%';
  }
  // useReversed picks which of the two <video>s for this clip index is shown.
  function setActive(idx, useReversed) {
    videos.forEach((v, i) => v.classList.toggle('active', !useReversed && i === idx));
    videosRev.forEach((v, i) => v.classList.toggle('active', !!useReversed && i === idx));
  }

  let activeIndex = 0;
  let videoTime = 0;          // seconds within the active clip, forward-timeline terms
  let restingCPIndex = 0;     // index into CHECKPOINTS we last came to rest at
  let accumulator = 0;
  let pendingSign = 0;
  let lastInputTime = 0;
  let paused = false;

  // The one piece of in-flight state. `otherEnd` is the checkpoint at the
  // far side of wherever this excursion is currently headed — reversing is
  // just swapping targetCPIndex and otherEnd, which is what makes repeated
  // direction changes correctly bounce between the same two checkpoints
  // instead of drifting, with no separately-tracked direction flag needed.
  let motion = null;
  // motion = { targetCPIndex, otherEnd, rate, playing, lastVideoTime, lastProgress }

  function enterPause(cpIndex) {
    const cp = CHECKPOINTS[cpIndex];
    if (!cp.label) return; // waypoint with nothing to show — just rest silently
    paused = true;
    accumulator = 0;
    cpLabelEl.textContent = cp.label;
    cpBodyEl.textContent = cp.body;
    checkpointTextEl.classList.add('visible');
  }

  // Always come to rest on the forward element (paused, positioned
  // correctly) regardless of which direction we arrived from, so captions
  // and the next trigger in either direction start from a consistent state.
  function arriveAt(cpIndex, sign) {
    restingCPIndex = cpIndex;
    motion = null;
    warmAround(activeIndex);
    videos[activeIndex].pause();
    videos[activeIndex].currentTime = videoTime;
    setActive(activeIndex, false);
    const cp = CHECKPOINTS[cpIndex];
    if (cp.auto) startMotion(cpIndex + sign);
    else enterPause(cpIndex);
  }

  function startMotion(targetCPIndex) {
    if (targetCPIndex < 0 || targetCPIndex >= CHECKPOINTS.length) return;
    motion = {
      targetCPIndex,
      otherEnd: restingCPIndex,
      rate: segmentRate(restingCPIndex, targetCPIndex),
      playing: false,
      lastVideoTime: undefined,
      lastProgress: 0,
    };
  }

  // Swaps target and origin — this is the entire "reverse direction" logic.
  function reverseMotion() {
    const rate = segmentRate(motion.otherEnd, motion.targetCPIndex);
    const newTarget = motion.otherEnd;
    motion.otherEnd = motion.targetCPIndex;
    motion.targetCPIndex = newTarget;
    motion.rate = rate;
    motion.playing = false;
    motion.lastVideoTime = undefined;
  }

  // Dismissing a pause must *itself* continue the film — not just step past
  // the boundary and wait for a second, separate scroll gesture to actually
  // move.
  function exitPause(dismissSign) {
    paused = false;
    accumulator = 0;
    checkpointTextEl.classList.remove('visible');
    startMotion(restingCPIndex + dismissSign);
  }

  function currentTimelinePos() { return elapsedBefore(activeIndex) + videoTime; }
  function motionSign() {
    const d = timelinePos(CHECKPOINTS[motion.targetCPIndex]) - currentTimelinePos();
    return d > 0.01 ? 1 : d < -0.01 ? -1 : 0;
  }

  // Mid-flight direction change: instant, no brake. Now that seeks are fast
  // (keyframe re-encode), switching straight to the other clip/direction
  // already looks smooth — a fixed brake delay was reading as lag,
  // especially on small scrolls. Pauses whichever element is currently
  // playing (if anything's actually started yet) and swaps target/origin.
  function reverseInstantly() {
    if (motion.playing) {
      const curVid = motionSign() > 0 ? videos[activeIndex] : videosRev[activeIndex];
      curVid.pause();
    }
    reverseMotion();
  }

  function registerInput(deltaPxLike, now) {
    if (deltaPxLike === 0) return;
    const sign = Math.sign(deltaPxLike);
    lastInputTime = now;
    if (paused) { exitPause(sign); return; }
    if (motion) {
      if (sign !== motionSign()) reverseInstantly();
      accumulator = 0;
      pendingSign = 0;
      return;
    }
    if (pendingSign !== 0 && sign !== pendingSign) accumulator = 0;
    pendingSign = sign;
    accumulator += Math.abs(deltaPxLike);
    if (accumulator >= TRIGGER_THRESHOLD && pendingSign !== 0) {
      accumulator = 0;
      startMotion(restingCPIndex + pendingSign);
    }
  }

  function handleMotion(now) {
    const tgt = CHECKPOINTS[motion.targetCPIndex];
    const sign = motionSign();
    if (sign === 0) { arriveAt(motion.targetCPIndex, sign); return; }

    const atTargetClip = activeIndex === tgt.clip;
    const subTarget = atTargetClip ? tgt.time : (sign > 0 ? clipDuration(activeIndex) : 0);
    const vid = sign > 0 ? videos[activeIndex] : videosRev[activeIndex];

    // Already sitting exactly at this clip's sub-target (e.g. we just
    // arrived here at its very last frame, about to hop to the next clip)
    // — skip play() entirely. Calling play() on a clip already at its
    // end/start is a real edge case that can make it silently rewind and
    // replay instead of advancing.
    const alreadyThere = sign > 0 ? videoTime >= subTarget - 0.03 : videoTime <= subTarget + 0.03;

    if (!alreadyThere) {
      if (!motion.playing) {
        vid.currentTime = sign > 0 ? videoTime : revTime(activeIndex, videoTime);
        vid.playbackRate = motion.rate;
        vid.play().catch(() => {});
        motion.playing = true;
        motion.lastVideoTime = undefined;
        setActive(activeIndex, sign < 0);
      }
      videoTime = sign > 0 ? vid.currentTime : revTime(activeIndex, vid.currentTime);

      // Stall guard: force this leg to complete if videoTime stops
      // advancing (stalled buffering, failed seek, etc.) instead of
      // blocking input forever.
      if (motion.lastVideoTime === undefined || Math.abs(videoTime - motion.lastVideoTime) > 0.02) {
        motion.lastVideoTime = videoTime;
        motion.lastProgress = now;
      } else if (now - motion.lastProgress > STALL_MS) {
        videoTime = subTarget;
      }
    }

    const reached = alreadyThere || (sign > 0
      ? (videoTime >= subTarget - 0.03 || vid.ended)
      : (videoTime <= subTarget + 0.03 || vid.ended));

    if (reached) {
      vid.pause();
      videoTime = subTarget;
      if (atTargetClip) {
        arriveAt(motion.targetCPIndex, sign);
      } else {
        activeIndex += sign;
        videoTime = sign > 0 ? 0 : clipDuration(activeIndex);
        motion.playing = false;
        warmAround(activeIndex);
      }
    }
  }

  function tick(now) {
    try {
      if (motion) handleMotion(now);
      else if (!paused && now - lastInputTime > IDLE_MS) accumulator = 0;
    } catch (err) {
      console.error('tick error, resetting motion state:', err);
      motion = null;
    }
    updateProgress();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  warmAround(0); // give clip 1 a head start before the user's first scroll

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    registerInput(e.deltaY, performance.now());
  }, { passive: false });

  let touchLastY = null;
  window.addEventListener('touchstart', (e) => {
    touchLastY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (touchLastY === null) return;
    const y = e.touches[0].clientY;
    const delta = (touchLastY - y) * TOUCH_MULTIPLIER;
    touchLastY = y;
    e.preventDefault();
    registerInput(delta, performance.now());
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    const now = performance.now();
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') registerInput(80, now);
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') registerInput(-80, now);
  });
</script>

</body>
</html>
