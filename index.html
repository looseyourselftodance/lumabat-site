<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMABAT — Construire l'Exception</title>
  <meta name="description" content="LUMABAT — Construction de maisons d'exception à Toulouse. Construire l'Exception." />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark: #1A1A1A;
      --bronze-light: #C4A882;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--dark);
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #scrubCanvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.9);
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #stage.ready #scrubCanvas { opacity: 1; }

    .progress-track {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 2px; background: rgba(248,247,244,0.12);
      z-index: 50;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: var(--bronze-light);
    }

    .loading-label {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      font-family: sans-serif;
      font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: rgba(248,247,244,0.55);
      transition: opacity 0.4s ease;
    }

    /* ── Checkpoint caption (placeholder copy — draft pass) ── */
    .checkpoint-text {
      position: fixed; left: 50%; bottom: 14%;
      transform: translate(-50%, 16px);
      z-index: 60; text-align: center;
      max-width: 620px; width: 84%;
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .checkpoint-text.visible { opacity: 1; transform: translate(-50%, 0); }
    .checkpoint-text .cp-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--bronze-light); margin-bottom: 0.9rem;
    }
    .checkpoint-text .cp-body {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.3rem, 3vw, 2.1rem);
      font-weight: 300; line-height: 1.4;
      color: #F8F7F4;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }
    .checkpoint-text .cp-hint {
      margin-top: 1.6rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: rgba(248,247,244,0.4);
    }
  </style>
</head>
<body>

<div id="stage">
  <canvas id="scrubCanvas"></canvas>
</div>
<div class="loading-label" id="loadingLabel">Loading…</div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="checkpoint-text" id="checkpointText">
  <div class="cp-label" id="cpLabel"></div>
  <div class="cp-body" id="cpBody"></div>
  <div class="cp-hint">scroll to continue</div>
</div>

<script>
  // ── Unified scroll-scrubbed sequence ──
  // The page itself never scrolls (fixed, full-viewport). Wheel / touch input
  // moves a virtual position through ONE merged sequence built from all 11 clips.
  // Scroll down / swipe up = forward. Scroll up / swipe down = backward.

  // Each entry is one "checkpoint" (scene). `cost` is the scroll-effort
  // budget in SUS (Scroll Unit Speed) to get through this checkpoint's
  // frames — independent of its actual frame count. Defaults to `count`
  // (neutral pacing) until we author real per-scene pacing later:
  // cost > count  -> plays slower than baseline (linger, room for text)
  // cost < count  -> plays faster than baseline (breeze through)
  const VIDEO_FRAMES = [
    { folder: 'videos/frames/01/', count: 80,  cost: 80 },
    { folder: 'videos/frames/02/', count: 160, cost: 160 },
    { folder: 'videos/frames/03/', count: 160, cost: 160 },
    { folder: 'videos/frames/04/', count: 8,   cost: 8 },
    { folder: 'videos/frames/05/', count: 160, cost: 160 },
    { folder: 'videos/frames/06/', count: 8,   cost: 8 },
    { folder: 'videos/frames/07/', count: 64,  cost: 64 },
    { folder: 'videos/frames/08/', count: 64,  cost: 64 },
    { folder: 'videos/frames/09/', count: 80,  cost: 80 },
    { folder: 'videos/frames/10/', count: 8,   cost: 8 },
    { folder: 'videos/frames/11/', count: 120, cost: 120 },
  ];

  // Placeholder captions, one per checkpoint — drafted from what's actually
  // in each clip. Meant to be replaced/adjusted, not final copy.
  const CHECKPOINT_TEXT = [
    { label: '01 — L’Arrivée',      body: 'Une terrasse pensée pour l’heure dorée.' },
    { label: '02 — La Piscine',            body: 'Là où la cuisine extérieure rencontre l’eau.' },
    { label: '03 — Le Séjour',           body: 'Ouvert, lumineux, pensé pour se retrouver.' },
    { label: '04 — La Buanderie',          body: 'Chaque détail compte, jusqu’à la buanderie.' },
    { label: '05 — Le Garage',             body: 'Stationnement couvert, à deux pas de la cuisine.' },
    { label: '06 — La Cuisine',            body: 'Là où la maison prend vie.' },
    { label: '07 — Le Couloir',            body: 'Un passage calme vers la salle de bain.' },
    { label: '08 — La Salle de Bain',      body: 'Douche pluie, lumière naturelle, aucun compromis.' },
    { label: '09 — La Chambre',            body: 'Le repos, encadré de verre et de verdure.' },
    { label: '10 — Le Bureau',             body: 'Un coin tranquille pour travailler chez soi.' },
    { label: '11 — Le Retour',             body: 'De retour au point de départ — la piscine, au crépuscule.' },
  ];

  // Source footage is stored at 8fps. A "burst" always plays that many
  // seconds of footage at its natural pace — never faster, never slower —
  // no matter how fast the scroll gesture that triggered it was.
  const SOURCE_FPS = 8;
  const BURST_SECONDS = 2;
  const BURST_FRAMES = BURST_SECONDS * SOURCE_FPS; // 16 frames per burst at neutral checkpoint scale

  // How much accumulated scroll (px) is needed to fire one burst — tuned to
  // roughly "two or three normal wheel notches."
  const TRIGGER_THRESHOLD = 260;
  const TOUCH_MULTIPLIER = 2.2;
  // If no scroll/touch event arrives for this long, we're no longer
  // "actively scrolling" — the current burst (if any) still finishes, but
  // no new one chains after it, and any leftover accumulator clears.
  const IDLE_MS = 150;

  const frameUrls = [];
  const checkpoints = [];
  VIDEO_FRAMES.forEach((v) => {
    const start = frameUrls.length;
    for (let i = 1; i <= v.count; i++) {
      frameUrls.push(v.folder + String(i).padStart(4, '0') + '.webp');
    }
    checkpoints.push({ start, end: frameUrls.length - 1, count: v.count, scale: v.count / v.cost });
  });
  const totalFrames = frameUrls.length;

  function checkpointAt(pos) {
    for (const c of checkpoints) {
      if (pos >= c.start && pos <= c.end) return c;
    }
    return checkpoints[checkpoints.length - 1];
  }

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('scrubCanvas');
  const ctx = canvas.getContext('2d');
  const loadingLabel = document.getElementById('loadingLabel');
  const progressFill = document.getElementById('progressFill');

  const images = new Array(totalFrames);
  let loadedCount = 0;
  let firstFrameReady = false;

  frameUrls.forEach((url, i) => {
    const img = new Image();
    img.onload = () => {
      loadedCount++;
      if (i === 0) {
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        firstFrameReady = true;
        stage.classList.add('ready');
        loadingLabel.style.opacity = '0';
        renderAtPosition(0);
      }
    };
    img.src = url;
    images[i] = img;
  });

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  let displayPos = 0;

  // Cross-fades between the two frames straddling `pos`, so motion between
  // our 8fps stills reads as continuous instead of a stepped slideshow.
  function renderAtPosition(pos) {
    if (!firstFrameReady) return;
    const idx0 = Math.floor(pos);
    const idx1 = Math.min(idx0 + 1, totalFrames - 1);
    const frac = pos - idx0;
    const img0 = images[idx0];
    if (!(img0 && img0.complete && img0.naturalWidth)) return;
    ctx.globalAlpha = 1;
    ctx.drawImage(img0, 0, 0, canvas.width, canvas.height);
    const img1 = images[idx1];
    if (frac > 0.01 && idx1 !== idx0 && img1 && img1.complete && img1.naturalWidth) {
      ctx.globalAlpha = frac;
      ctx.drawImage(img1, 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
    }
    progressFill.style.width = ((pos + 1) / totalFrames * 100) + '%';
  }

  // ── Trigger-and-play engine ──
  // The page opens paused on frame 0 — a film waiting to be played. Scroll
  // input never moves the playhead directly; it just accumulates. Once
  // enough has accumulated (TRIGGER_THRESHOLD), it fires a "burst": a fixed
  // chunk of footage that plays itself out at its own natural pace over
  // BURST_SECONDS, however fast or slow the triggering scroll was. Keep
  // scrolling and finished bursts chain into the next one; stop scrolling
  // and no new burst starts once the current one finishes.
  //
  // Bursts never cross a checkpoint boundary — arriving exactly at one
  // pauses the engine and shows that checkpoint's caption. Any scroll
  // dismisses it (nudging one frame in that direction) and resumes.
  let accumulator = 0;
  let pendingSign = 0;
  let lastInputTime = 0;
  let burst = null; // { from, to, start, duration } while a burst is animating
  let paused = false;

  const checkpointTextEl = document.getElementById('checkpointText');
  const cpLabelEl = document.getElementById('cpLabel');
  const cpBodyEl = document.getElementById('cpBody');

  function enterPause(idx) {
    paused = true;
    accumulator = 0;
    const t = CHECKPOINT_TEXT[idx];
    cpLabelEl.textContent = t.label;
    cpBodyEl.textContent = t.body;
    checkpointTextEl.classList.add('visible');
  }

  function exitPause(dismissSign) {
    paused = false;
    accumulator = 0;
    checkpointTextEl.classList.remove('visible');
    displayPos = clamp(displayPos + dismissSign, 0, totalFrames - 1);
  }

  function registerInput(deltaPxLike, now) {
    if (deltaPxLike === 0) return;
    const sign = Math.sign(deltaPxLike);
    lastInputTime = now;
    if (paused) { exitPause(sign); return; }
    if (pendingSign !== 0 && sign !== pendingSign) accumulator = 0; // direction reversed before firing
    pendingSign = sign;
    accumulator += Math.abs(deltaPxLike);
    maybeStartBurst(now);
  }

  function maybeStartBurst(now) {
    if (burst || paused || accumulator < TRIGGER_THRESHOLD || pendingSign === 0) return;
    accumulator -= TRIGGER_THRESHOLD;
    const cp = checkpointAt(displayPos);
    const frames = BURST_FRAMES * cp.scale;
    const to = pendingSign > 0
      ? clamp(displayPos + frames, 0, cp.end)
      : clamp(displayPos - frames, cp.start, totalFrames - 1);
    const distance = Math.abs(to - displayPos);
    const duration = Math.max((distance / SOURCE_FPS) * 1000, 50); // ms, natural playback pace
    burst = { from: displayPos, to, start: now, duration };
  }

  function tick(now) {
    if (burst) {
      const t = clamp((now - burst.start) / burst.duration, 0, 1);
      displayPos = burst.from + (burst.to - burst.from) * t;
      if (t >= 1) {
        displayPos = burst.to;
        burst = null;
        const cp = checkpointAt(displayPos);
        if (displayPos === cp.end || displayPos === cp.start) {
          enterPause(checkpoints.indexOf(cp));
        } else if (now - lastInputTime < IDLE_MS) {
          maybeStartBurst(now);
        }
      }
    } else if (!paused && now - lastInputTime > IDLE_MS) {
      accumulator = 0; // stale leftover from a scroll that trailed off — don't fire it later
    }

    renderAtPosition(displayPos);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    registerInput(e.deltaY, performance.now());
  }, { passive: false });

  let touchLastY = null;
  window.addEventListener('touchstart', (e) => {
    touchLastY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (touchLastY === null) return;
    const y = e.touches[0].clientY;
    const delta = (touchLastY - y) * TOUCH_MULTIPLIER;
    touchLastY = y;
    e.preventDefault();
    registerInput(delta, performance.now());
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    const now = performance.now();
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') registerInput(80, now);
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') registerInput(-80, now);
  });
</script>

</body>
</html>
