<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMABAT — Construire l'Exception</title>
  <meta name="description" content="LUMABAT — Construction de maisons d'exception à Toulouse. Construire l'Exception." />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark: #1A1A1A;
      --bronze-light: #C4A882;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--dark);
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #scrubCanvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.9);
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #stage.ready #scrubCanvas { opacity: 1; }

    .progress-track {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 2px; background: rgba(248,247,244,0.12);
      z-index: 50;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: var(--bronze-light);
    }

    .loading-label {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      font-family: sans-serif;
      font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: rgba(248,247,244,0.55);
      transition: opacity 0.4s ease;
    }
  </style>
</head>
<body>

<div id="stage">
  <canvas id="scrubCanvas"></canvas>
</div>
<div class="loading-label" id="loadingLabel">Loading…</div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

<script>
  // ── Unified scroll-scrubbed sequence ──
  // The page itself never scrolls (fixed, full-viewport). Wheel / touch input
  // moves a virtual position through ONE merged sequence built from all 11 clips.
  // Scroll down / swipe up = forward. Scroll up / swipe down = backward.

  // Each entry is one "checkpoint" (scene). `cost` is the scroll-effort
  // budget in SUS (Scroll Unit Speed) to get through this checkpoint's
  // frames — independent of its actual frame count. Defaults to `count`
  // (neutral pacing) until we author real per-scene pacing later:
  // cost > count  -> plays slower than baseline (linger, room for text)
  // cost < count  -> plays faster than baseline (breeze through)
  const VIDEO_FRAMES = [
    { folder: 'videos/frames/01/', count: 80,  cost: 80 },
    { folder: 'videos/frames/02/', count: 160, cost: 160 },
    { folder: 'videos/frames/03/', count: 160, cost: 160 },
    { folder: 'videos/frames/04/', count: 8,   cost: 8 },
    { folder: 'videos/frames/05/', count: 160, cost: 160 },
    { folder: 'videos/frames/06/', count: 8,   cost: 8 },
    { folder: 'videos/frames/07/', count: 64,  cost: 64 },
    { folder: 'videos/frames/08/', count: 64,  cost: 64 },
    { folder: 'videos/frames/09/', count: 80,  cost: 80 },
    { folder: 'videos/frames/10/', count: 8,   cost: 8 },
    { folder: 'videos/frames/11/', count: 120, cost: 120 },
  ];

  // Governed speed band, in frames/sec. Motion never exceeds MAX_SPEED no
  // matter how hard you scroll, and never drops below MIN_SPEED as long as
  // there's active input — scroll intensity only picks where in this band
  // we sit, it never scales speed proportionally beyond it.
  const MIN_SPEED = 3;
  const MAX_SPEED = 14;
  // Converts a raw px-per-second input rate into a frames/sec magnitude,
  // before it gets clamped into [MIN_SPEED, MAX_SPEED].
  const INPUT_TO_SPEED = 0.05;
  const TOUCH_MULTIPLIER = 2.2;
  // How much smoothing is applied to the input-intensity signal itself
  // (separate from position smoothing) — avoids single noisy events
  // yanking the speed around.
  const EMA_ALPHA = 0.4;
  // If no scroll/touch event arrives for this long, we're considered idle
  // and start decelerating to a stop instead of coasting indefinitely.
  const IDLE_MS = 140;
  const DECAY = 0.85;

  const frameUrls = [];
  const checkpoints = [];
  VIDEO_FRAMES.forEach((v) => {
    const start = frameUrls.length;
    for (let i = 1; i <= v.count; i++) {
      frameUrls.push(v.folder + String(i).padStart(4, '0') + '.webp');
    }
    checkpoints.push({ start, end: frameUrls.length - 1, count: v.count, scale: v.count / v.cost });
  });
  const totalFrames = frameUrls.length;

  function checkpointAt(pos) {
    for (const c of checkpoints) {
      if (pos >= c.start && pos <= c.end) return c;
    }
    return checkpoints[checkpoints.length - 1];
  }

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('scrubCanvas');
  const ctx = canvas.getContext('2d');
  const loadingLabel = document.getElementById('loadingLabel');
  const progressFill = document.getElementById('progressFill');

  const images = new Array(totalFrames);
  let loadedCount = 0;
  let firstFrameReady = false;

  frameUrls.forEach((url, i) => {
    const img = new Image();
    img.onload = () => {
      loadedCount++;
      if (i === 0) {
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        firstFrameReady = true;
        stage.classList.add('ready');
        loadingLabel.style.opacity = '0';
        renderAtPosition(0);
      }
    };
    img.src = url;
    images[i] = img;
  });

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  let displayPos = 0;

  // Cross-fades between the two frames straddling `pos`, so motion between
  // our 8fps stills reads as continuous instead of a stepped slideshow.
  function renderAtPosition(pos) {
    if (!firstFrameReady) return;
    const idx0 = Math.floor(pos);
    const idx1 = Math.min(idx0 + 1, totalFrames - 1);
    const frac = pos - idx0;
    const img0 = images[idx0];
    if (!(img0 && img0.complete && img0.naturalWidth)) return;
    ctx.globalAlpha = 1;
    ctx.drawImage(img0, 0, 0, canvas.width, canvas.height);
    const img1 = images[idx1];
    if (frac > 0.01 && idx1 !== idx0 && img1 && img1.complete && img1.naturalWidth) {
      ctx.globalAlpha = frac;
      ctx.drawImage(img1, 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
    }
    progressFill.style.width = ((pos + 1) / totalFrames * 100) + '%';
  }

  // ── Governed-speed input engine ──
  // Scroll/touch/keyboard events don't move the playhead directly — they
  // feed a smoothed "how hard are you scrolling" signal (inputMagnitude).
  // Every animation frame, that signal (clamped into the speed band, scaled
  // per-checkpoint) is integrated into position. No queued distance, no
  // proportional jumps — just a governed rate that scroll turns on/off.
  let inputMagnitude = 0;
  let inputSign = 0;
  let lastEventTime = null;
  let lastInputTime = 0;
  let lastTickTime = null;

  function registerInput(deltaPxLike, now) {
    if (lastEventTime != null) {
      const dt = clamp((now - lastEventTime) / 1000, 0.01, 0.5);
      const instantRate = Math.abs(deltaPxLike) * INPUT_TO_SPEED / dt;
      inputMagnitude += (instantRate - inputMagnitude) * EMA_ALPHA;
    } else {
      inputMagnitude = Math.abs(deltaPxLike) * INPUT_TO_SPEED;
    }
    lastEventTime = now;
    lastInputTime = now;
    if (deltaPxLike !== 0) inputSign = Math.sign(deltaPxLike);
  }

  function tick(now) {
    if (lastTickTime == null) lastTickTime = now;
    const dtTick = clamp((now - lastTickTime) / 1000, 0, 0.1);
    lastTickTime = now;

    if (now - lastInputTime > IDLE_MS) {
      inputMagnitude *= DECAY;
      if (inputMagnitude < 0.01) { inputMagnitude = 0; inputSign = 0; }
    }

    if (inputMagnitude > 0 && inputSign !== 0) {
      const cp = checkpointAt(displayPos);
      const speed = clamp(inputMagnitude, MIN_SPEED, MAX_SPEED) * cp.scale;
      displayPos = clamp(displayPos + inputSign * speed * dtTick, 0, totalFrames - 1);
      if (displayPos === 0 || displayPos === totalFrames - 1) { inputMagnitude = 0; inputSign = 0; }
    }

    renderAtPosition(displayPos);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    registerInput(e.deltaY, performance.now());
  }, { passive: false });

  let touchLastY = null;
  window.addEventListener('touchstart', (e) => {
    touchLastY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (touchLastY === null) return;
    const y = e.touches[0].clientY;
    const delta = (touchLastY - y) * TOUCH_MULTIPLIER;
    touchLastY = y;
    e.preventDefault();
    registerInput(delta, performance.now());
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    const now = performance.now();
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') registerInput(80, now);
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') registerInput(-80, now);
  });
</script>

</body>
</html>
