<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMABAT — Construire l'Exception</title>
  <meta name="description" content="LUMABAT — Construction de maisons d'exception à Toulouse. Construire l'Exception." />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:     #F8F7F4;
      --anthracite:#2C2C2C;
      --dark:      #1A1A1A;
      --beige:     #E8E0D0;
      --bronze:    #A0845C;
      --bronze-light: #C4A882;
      --text-light:#6B6B6B;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--dark);
      overflow-x: hidden;
    }

    /* ── STORY (scroll-scrubbed frame sequence) ── */
    .story { background: var(--dark); }
    .story-item {
      position: relative;
      background: var(--dark);
    }
    .story-pin {
      position: sticky; top: 0;
      height: 100vh;
      overflow: hidden;
    }
    .story-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.88);
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .story-pin.ready .story-canvas { opacity: 1; }
    .story-pin::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(26,26,26,0.25) 0%, rgba(26,26,26,0) 30%, rgba(26,26,26,0) 70%, rgba(26,26,26,0.35) 100%);
      pointer-events: none;
    }
    .story-count {
      position: absolute; left: 5%; bottom: 2.5rem; z-index: 2;
      font-family: sans-serif;
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.25em;
      text-transform: uppercase; color: rgba(248,247,244,0.7);
      display: flex; align-items: center; gap: 0.6rem;
    }
    .story-count .bronze { color: var(--bronze-light); }
    .story-count .bar {
      width: 2.5rem; height: 1px; background: rgba(248,247,244,0.3);
    }
    .story-dots {
      position: fixed; right: 4%; top: 50%; transform: translateY(-50%);
      z-index: 50; display: flex; flex-direction: column; gap: 0.55rem;
      opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
    }
    .story-dots.visible { opacity: 1; }
    .story-dots .dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(248,247,244,0.3);
      transition: background 0.3s, transform 0.3s;
    }
    .story-dots .dot.active { background: var(--bronze-light); transform: scale(1.6); }
  </style>
</head>
<body>

<!-- STORY (scroll-scrubbed frame sequence, 1px scroll = 1 frame) -->
<section class="story" id="story">
  <div class="story-item" data-count="80" data-folder="videos/frames/01/" style="height: calc(100vh + 80px)">
    <div class="story-pin">
      <canvas class="story-canvas"></canvas>
      <div class="story-count"><span class="bronze">01</span><span class="bar"></span><span>11</span></div>
    </div>
  </div>
  <div class="story-item" data-count="160" data-folder="videos/frames/02/" style="height: calc(100vh + 160px)">
    <div class="story-pin">
      <canvas class="story-canvas"></canvas>
      <div class="story-count"><span class="bronze">02</span><span class="bar"></span><span>11</span></div>
    </div>
  </div>
  <div class="story-item" data-count="160" data-folder="videos/frames/03/" style="height: calc(100vh + 160px)">
    <div class="story-pin">
      <canvas class="story-canvas"></canvas>
      <div class="story-count"><span class="bronze">03</span><span class="bar"></span><span>11</span></div>
    </div>
  </div>
  <div class="story-item" data-count="8" data-folder="videos/frames/04/" style="height: calc(100vh + 8px)">
    <div class="story-pin">
      <canvas class="story-canvas"></canvas>
      <div class="story-count"><span class="bronze">04</span><span class="bar"></span><span>11</span></div>
    </div>
  </div>
  <div class="story-item" data-count="160" data-folder="videos/frames/05/" style="height: calc(100vh + 160px)">
    <div class="story-pin">
      <canvas class="story-canvas"></canvas>
      <div class="story-count"><span class="bronze">05</span><span class="bar"></span><span>11</span></div>
    </div>
  </div>
  <div class="story-item" data-count="8" data-folder="videos/frames/06/" style="height: calc(100vh + 8px)">
    <div class="story-pin">
      <canvas class="story-canvas"></canvas>
      <div class="story-count"><span class="bronze">06</span><span class="bar"></span><span>11</span></div>
    </div>
  </div>
  <div class="story-item" data-count="64" data-folder="videos/frames/07/" style="height: calc(100vh + 64px)">
    <div class="story-pin">
      <canvas class="story-canvas"></canvas>
      <div class="story-count"><span class="bronze">07</span><span class="bar"></span><span>11</span></div>
    </div>
  </div>
  <div class="story-item" data-count="64" data-folder="videos/frames/08/" style="height: calc(100vh + 64px)">
    <div class="story-pin">
      <canvas class="story-canvas"></canvas>
      <div class="story-count"><span class="bronze">08</span><span class="bar"></span><span>11</span></div>
    </div>
  </div>
  <div class="story-item" data-count="80" data-folder="videos/frames/09/" style="height: calc(100vh + 80px)">
    <div class="story-pin">
      <canvas class="story-canvas"></canvas>
      <div class="story-count"><span class="bronze">09</span><span class="bar"></span><span>11</span></div>
    </div>
  </div>
  <div class="story-item" data-count="8" data-folder="videos/frames/10/" style="height: calc(100vh + 8px)">
    <div class="story-pin">
      <canvas class="story-canvas"></canvas>
      <div class="story-count"><span class="bronze">10</span><span class="bar"></span><span>11</span></div>
    </div>
  </div>
  <div class="story-item" data-count="120" data-folder="videos/frames/11/" style="height: calc(100vh + 120px)">
    <div class="story-pin">
      <canvas class="story-canvas"></canvas>
      <div class="story-count"><span class="bronze">11</span><span class="bar"></span><span>11</span></div>
    </div>
  </div>
</section>
<div class="story-dots" id="storyDots"></div>

<script>
  // ── STORY scroll-scrubbed frame sequence ──
  // 1px of scroll = 1 frame, forward on scroll down, backward on scroll up.
  (function () {
    const items = Array.from(document.querySelectorAll('.story-item'));
    if (!items.length) return;

    const dotsWrap = document.getElementById('storyDots');
    items.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      dotsWrap.appendChild(d);
    });
    const dots = Array.from(dotsWrap.children);

    class Scrubber {
      constructor(item) {
        this.item = item;
        this.pin = item.querySelector('.story-pin');
        this.canvas = item.querySelector('.story-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.count = parseInt(item.getAttribute('data-count'), 10);
        this.folder = item.getAttribute('data-folder');
        this.images = new Array(this.count);
        this.currentIndex = -1;
        this.ready = false;
        this.preloading = false;
      }
      frameUrl(i) {
        return this.folder + String(i + 1).padStart(4, '0') + '.jpg';
      }
      preload() {
        if (this.preloading) return;
        this.preloading = true;
        for (let i = 0; i < this.count; i++) {
          const img = new Image();
          if (i === 0) {
            img.onload = () => {
              this.canvas.width = img.naturalWidth;
              this.canvas.height = img.naturalHeight;
              this.ready = true;
              this.pin.classList.add('ready');
              this.draw(Math.max(this.currentIndex, 0));
            };
          }
          img.src = this.frameUrl(i);
          this.images[i] = img;
        }
      }
      draw(index) {
        index = Math.max(0, Math.min(this.count - 1, index));
        if (!this.ready) { this.currentIndex = index; return; }
        if (index === this.currentIndex) return;
        const img = this.images[index];
        if (img && img.complete && img.naturalWidth) {
          this.ctx.drawImage(img, 0, 0, this.canvas.width, this.canvas.height);
          this.currentIndex = index;
        }
      }
      updateFromScroll() {
        const rect = this.item.getBoundingClientRect();
        const framePx = -rect.top; // 0 at section entry, grows 1:1 with scroll depth
        if (framePx < -window.innerHeight || framePx > this.count + window.innerHeight) return;
        this.draw(Math.round(framePx));
      }
    }

    const scrubbers = items.map((item) => new Scrubber(item));

    const preloadObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          const idx = items.indexOf(entry.target);
          scrubbers[idx].preload();
          preloadObserver.unobserve(entry.target);
        }
      });
    }, { rootMargin: '100% 0px 100% 0px' });

    const dotsObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        const idx = items.indexOf(entry.target);
        if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
          dots.forEach((d, i) => d.classList.toggle('active', i === idx));
        }
      });
    }, { threshold: [0, 0.5, 1] });

    items.forEach((item) => {
      preloadObserver.observe(item);
      dotsObserver.observe(item);
    });

    const storySection = document.getElementById('story');
    const dotsVisibility = new IntersectionObserver((entries) => {
      entries.forEach((entry) => dotsWrap.classList.toggle('visible', entry.isIntersecting));
    }, { threshold: 0 });
    dotsVisibility.observe(storySection);

    let ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        scrubbers.forEach((s) => s.updateFromScroll());
        ticking = false;
      });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();
</script>

</body>
</html>
