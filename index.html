<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMABAT — Construire l'Exception</title>
  <meta name="description" content="LUMABAT — Construction de maisons d'exception à Toulouse. Construire l'Exception." />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark: #1A1A1A;
      --bronze-light: #C4A882;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--dark);
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .clip {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.9);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .clip.active { opacity: 1; z-index: 2; }
    /* Used for a split second when swapping forward<->reversed (a direction
       reversal) — that swap should be a clean cut, not a crossfade, since a
       blend there just shows two near-identical frames overlapping instead
       of a seamless continuation. */
    .clip.instant { transition: none; }

    .progress-track {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 2px; background: rgba(248,247,244,0.12);
      z-index: 50;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: var(--bronze-light);
    }

    .loading-label {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      font-family: sans-serif;
      font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: rgba(248,247,244,0.55);
      transition: opacity 0.4s ease;
    }

    /* Short-and-wide dark glass panel behind text overlays, so copy stays
       legible over bright/busy frames without flattening the video itself. */
    .text-panel {
      background: rgba(20,17,15,0.28);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 3px;
      padding: 1.9rem 4.4rem;
    }

    .checkpoint-text {
      position: fixed; left: 50%; bottom: 14%;
      transform: translate(-50%, 16px);
      z-index: 60; text-align: center;
      max-width: 620px; width: 84%;
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .checkpoint-text.visible { opacity: 1; transform: translate(-50%, 0); }
    .checkpoint-text .cp-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--bronze-light); margin-bottom: 0.9rem;
    }
    .checkpoint-text .cp-body {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.3rem, 3vw, 2.1rem);
      font-weight: 300; line-height: 1.4;
      color: #F8F7F4;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }
    .checkpoint-text .cp-hint {
      margin-top: 1.6rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: rgba(248,247,244,0.4);
    }
    /* Closing CTA row — only populated on the final checkpoint (see
       enterPause()). Empty on every other checkpoint, so it takes no space. */
    .checkpoint-text .cp-ctas {
      display: flex; flex-wrap: wrap;
      justify-content: center; gap: 0.8rem;
      margin-top: 1.6rem;
    }
    .checkpoint-text .cp-ctas:empty { margin-top: 0; }
    .cp-cta-btn {
      pointer-events: auto;
      font-family: 'Inter', sans-serif;
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: #F8F7F4; text-decoration: none;
      border: 1px solid rgba(196,168,130,0.55);
      border-radius: 2px;
      padding: 0.7rem 1.3rem;
      transition: background 0.25s ease, border-color 0.25s ease;
    }
    .cp-cta-btn:hover {
      background: rgba(196,168,130,0.15);
      border-color: var(--bronze-light);
    }
    .cp-cta-btn.primary {
      background: var(--bronze-light);
      color: #1A1A1A;
      border-color: var(--bronze-light);
    }
    .cp-cta-btn.primary:hover { background: #d4bb96; }

    /* ── Opening hero: logo + headline, shown only at rest on checkpoint 0.
       Fades out the instant the film actually starts (see startMotion()) —
       vertically centered rather than bottom-third like the checkpoint
       captions, since this is a landing moment, not a scene annotation. ── */
    .hero {
      position: fixed; inset: 0;
      z-index: 55;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    .hero.hidden { opacity: 0; }
    .hero-logo {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      letter-spacing: 0.35em;
      color: #F8F7F4;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }
    .hero-logo .bat { color: var(--bronze-light); }
    .hero-rule {
      width: 110px; height: 1px;
      background: var(--bronze-light);
      opacity: 0.6;
      margin: 1.2rem 0 1.7rem;
    }
    .hero-headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.25;
      color: #F8F7F4;
      text-shadow: 0 2px 24px rgba(0,0,0,0.55);
      max-width: 720px;
      padding: 0 1rem;
    }
    .hero-specs {
      margin-top: 0.9rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--bronze-light);
    }
    .hero-hint {
      margin-top: 2.3rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: rgba(248,247,244,0.5);
    }
  </style>
</head>
<body>

<div id="stage">
  <video class="clip active" id="fwdVideo" src="videos/tour.mp4" muted playsinline preload="auto"></video>
  <!-- Reversed twin: same footage, frames in reverse order. Playing this
       forward looks exactly like the original rewinding — genuine native
       decode either direction, since <video> has no negative playbackRate. -->
  <video class="clip" id="revVideo" src="videos/tour-rev.mp4" muted playsinline preload="auto"></video>
</div>
<div class="loading-label" id="loadingLabel">Loading…</div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="hero" id="hero">
  <div class="text-panel">
    <div class="hero-logo">LUMA<span class="bat">BAT</span></div>
    <div class="hero-rule"></div>
    <div class="hero-headline">Maison Ambre</div>
    <div class="hero-specs">Trois chambres · Plain-pied · Piscine</div>
  </div>
  <div class="hero-hint">scroll pour explorer</div>
</div>
<div class="checkpoint-text text-panel" id="checkpointText">
  <div class="cp-label" id="cpLabel"></div>
  <div class="cp-body" id="cpBody"></div>
  <div class="cp-ctas" id="cpCtas"></div>
  <div class="cp-hint">scroll pour continuer</div>
</div>

<script>
  // ── Real-video trigger-and-play engine, single unified take ──
  // One continuous 82s video replaces the old 11-clip set, so the whole
  // engine collapses to a single timeline in seconds — no clip index, no
  // clip-boundary crossing, no per-clip warm-up. Scroll input never moves
  // anything directly; it accumulates, and once enough has built up ("one
  // good scroll"), it commits to playing straight through to the next (or
  // previous) checkpoint at a fixed pace.
  //
  // Backward: <video> has no negative playbackRate, so true reverse
  // playback isn't possible on the forward file. Instead a pre-rendered
  // reversed twin (frames in reverse order) plays *forward* to simulate it,
  // with genuine native decode in both directions.
  //
  // All in-flight state lives in ONE object, `motion`, and the whole tick
  // loop is wrapped in try/catch so a bug here can never again silently
  // kill the animation loop (the most likely real explanation for past
  // "freezes": an uncaught error stops requestAnimationFrame from ever
  // being called again, with no visible error to the user).

  const TOTAL_DURATION = 82; // seconds, from ffprobe — hardcoded to avoid a metadata-load race

  // Checkpoints found by scanning the actual footage: each time is the
  // objectively sharpest frame (lowest ffmpeg blurdetect score) inside the
  // window the checkpoint should land in. Checkpoint 0 is the page's
  // opening position (silent — nothing to arrive at, no caption).
  const CHECKPOINTS = [
    { time: 0 },
    { time: 7.000000,  label: '01 — La Terrasse',          body: 'Piscine à débordement, terrasse traversante.' },
    { time: 11.400000, label: '02 — L’Aire Gourmet',       body: 'Cuisine secondaire, barbecue intégré.' },
    { time: 18.133333, label: '03 — La Salle à Manger',    body: 'Baies coulissantes, continuité totale avec l’extérieur.' },
    { time: 35.933333, label: '04 — La Buanderie',         body: 'Buanderie équipée, rangements sur mesure.' },
    { time: 41.000000, label: '05 — Le Garage',            body: 'Garage double, accès direct à la maison.' },
    { time: 58.933333, label: '06 — La Chambre',           body: 'Trois chambres au total. Suite parentale, terrasse partagée, coin soir.' },
    { time: 66.000000, label: '07 — Chambre Secondaire',   body: 'Chambres avec armoires intégrées, de 15 à 20 m².' },
    { time: 80.933333, label: '08 — Retour à la Piscine',  body: 'La piscine, une dernière fois.',
      ctas: [
        { label: 'En savoir plus',            href: 'index.html' },
        { label: 'Voir le plan de la maison', href: 'plan-maison-ambre.pdf', blank: true },
        { label: 'Contact',                   href: 'contact.html', primary: true },
      ] },
  ];

  // Pacing is already baked into the footage at render time (this export,
  // unlike the first-pass 11-clip set, was rendered with speed decided in
  // Twinmotion) — every segment just plays at native 1x, no per-segment
  // playbackRate stretching/compressing to hit a fixed duration.
  const PLAY_RATE = 1;

  // Maps a position in the forward timeline to the equivalent position in
  // the reversed twin's own timeline (frame order is flipped).
  function revTime(t) { return TOTAL_DURATION - t; }

  const fwd = document.getElementById('fwdVideo');
  const rev = document.getElementById('revVideo');
  const loadingLabel = document.getElementById('loadingLabel');
  const progressFill = document.getElementById('progressFill');
  const checkpointTextEl = document.getElementById('checkpointText');
  const cpLabelEl = document.getElementById('cpLabel');
  const cpBodyEl = document.getElementById('cpBody');
  const cpCtasEl = document.getElementById('cpCtas');
  const heroEl = document.getElementById('hero');

  fwd.playsInline = true;
  rev.playsInline = true;

  let ready = false;
  fwd.addEventListener('loadeddata', () => {
    if (ready) return;
    ready = true;
    loadingLabel.style.opacity = '0';
  }, { once: true });

  let lastProgressPct = -1;
  function updateProgress() {
    const pct = videoTime / TOTAL_DURATION * 100;
    if (Math.abs(pct - lastProgressPct) < 0.05) return; // skip redundant layout/paint
    lastProgressPct = pct;
    progressFill.style.width = pct + '%';
  }
  // instant skips the crossfade — used specifically for a direction
  // reversal, where forward/reversed should show essentially the same
  // frame and a blend would just look like overlap.
  function setActive(useReversed, instant) {
    if (instant) { fwd.classList.add('instant'); rev.classList.add('instant'); }
    fwd.classList.toggle('active', !useReversed);
    rev.classList.toggle('active', !!useReversed);
    if (instant) {
      void fwd.offsetHeight; // force layout so transition:none applies before it's removed
      fwd.classList.remove('instant');
      rev.classList.remove('instant');
    }
  }

  let videoTime = 0;          // seconds, position in the single timeline
  let restingCPIndex = 0;     // index into CHECKPOINTS we last came to rest at
  let accumulator = 0;
  let pendingSign = 0;
  let lastInputTime = 0;
  let paused = false;

  // The one piece of in-flight state. `otherEnd` is the checkpoint at the
  // far side of wherever this excursion is currently headed — reversing is
  // just swapping targetCPIndex and otherEnd, which is what makes repeated
  // direction changes correctly bounce between the same two checkpoints
  // instead of drifting, with no separately-tracked direction flag needed.
  let motion = null;
  // motion = { targetCPIndex, otherEnd, rate, playing, justReversed, lastVideoTime, lastProgress }

  function enterPause(cpIndex) {
    const cp = CHECKPOINTS[cpIndex];
    if (!cp.label) return; // waypoint with nothing to show — just rest silently
    paused = true;
    accumulator = 0;
    cpLabelEl.textContent = cp.label;
    cpBodyEl.textContent = cp.body;
    cpCtasEl.innerHTML = ''; // cleared every time; only the final checkpoint repopulates it
    (cp.ctas || []).forEach((cta) => {
      const a = document.createElement('a');
      a.className = 'cp-cta-btn' + (cta.primary ? ' primary' : '');
      a.textContent = cta.label;
      a.href = cta.href;
      if (cta.blank) { a.target = '_blank'; a.rel = 'noopener'; }
      cpCtasEl.appendChild(a);
    });
    checkpointTextEl.classList.add('visible');
  }

  // Always come to rest on the forward element (paused, positioned
  // correctly) regardless of which direction we arrived from, so captions
  // and the next trigger in either direction start from a consistent state.
  function arriveAt(cpIndex, sign) {
    restingCPIndex = cpIndex;
    motion = null;
    fwd.pause();
    fwd.currentTime = videoTime;
    setActive(false, sign < 0); // arriving backward = was showing the reversed twin, swap to forward instantly
    const cp = CHECKPOINTS[cpIndex];
    if (cp.auto) startMotion(cpIndex + sign);
    else enterPause(cpIndex);
  }

  function startMotion(targetCPIndex) {
    if (targetCPIndex < 0 || targetCPIndex >= CHECKPOINTS.length) return;
    heroEl.classList.add('hidden'); // the film has actually started — no-op after the first time
    motion = {
      targetCPIndex,
      otherEnd: restingCPIndex,
      rate: PLAY_RATE,
      playing: false,
      justReversed: false,
      lastVideoTime: undefined,
      lastProgress: 0,
    };
  }

  // Swaps target and origin — this is the entire "reverse direction" logic.
  function reverseMotion() {
    const newTarget = motion.otherEnd;
    motion.otherEnd = motion.targetCPIndex;
    motion.targetCPIndex = newTarget;
    motion.rate = PLAY_RATE;
    motion.playing = false;
    motion.justReversed = true; // next setActive() should be an instant cut, not a crossfade
    motion.lastVideoTime = undefined;
  }

  // Dismissing a pause must *itself* continue the film — not just step past
  // the boundary and wait for a second, separate scroll gesture.
  function exitPause(dismissSign) {
    paused = false;
    accumulator = 0;
    checkpointTextEl.classList.remove('visible');
    startMotion(restingCPIndex + dismissSign);
  }

  function motionSign() {
    const d = CHECKPOINTS[motion.targetCPIndex].time - videoTime;
    return d > 0.01 ? 1 : d < -0.01 ? -1 : 0;
  }

  // Mid-flight direction change: instant, no brake. Pauses whichever
  // element is currently playing (if anything's actually started yet) and
  // swaps target/origin.
  function reverseInstantly() {
    if (motion.playing) {
      const curSign = motionSign();
      const curVid = curSign > 0 ? fwd : rev;
      curVid.pause();
      // videoTime is only updated once per tick (~16ms), but this pause
      // happens the instant the scroll event fires. Resync to curVid's true
      // position right now, so the incoming element seeks to exactly where
      // this one actually stopped, not a stale position.
      videoTime = curSign > 0 ? curVid.currentTime : revTime(curVid.currentTime);
    }
    reverseMotion();
  }

  function registerInput(deltaPxLike, now) {
    if (deltaPxLike === 0) return;
    const sign = Math.sign(deltaPxLike);
    lastInputTime = now;
    if (paused) { exitPause(sign); return; }
    if (motion) {
      if (sign !== motionSign()) reverseInstantly();
      accumulator = 0;
      pendingSign = 0;
      return;
    }
    if (pendingSign !== 0 && sign !== pendingSign) accumulator = 0;
    pendingSign = sign;
    accumulator += Math.abs(deltaPxLike);
    if (accumulator >= TRIGGER_THRESHOLD && pendingSign !== 0) {
      accumulator = 0;
      startMotion(restingCPIndex + pendingSign);
    }
  }

  // How much accumulated scroll (px) is needed to trigger a checkpoint —
  // "one good scroll" — tuned to roughly two or three normal wheel notches.
  const TRIGGER_THRESHOLD = 260;
  const TOUCH_MULTIPLIER = 2.2;
  const IDLE_MS = 150;
  // If a motion's video stops advancing for this long (stalled buffering,
  // failed seek, etc.), force it to complete rather than block input
  // indefinitely.
  const STALL_MS = 1200;

  function handleMotion(now) {
    const tgt = CHECKPOINTS[motion.targetCPIndex];
    const sign = motionSign();
    if (sign === 0) { arriveAt(motion.targetCPIndex, sign); return; }

    const subTarget = tgt.time;
    const vid = sign > 0 ? fwd : rev;

    // Already sitting exactly at the target (e.g. we just arrived here) —
    // skip play() entirely. Calling play() on a clip already at its
    // end/start is a real edge case that can make it silently rewind and
    // replay instead of advancing.
    const alreadyThere = sign > 0 ? videoTime >= subTarget - 0.03 : videoTime <= subTarget + 0.03;

    if (!alreadyThere) {
      if (!motion.playing) {
        vid.currentTime = sign > 0 ? videoTime : revTime(videoTime);
        vid.playbackRate = motion.rate;
        vid.play().catch(() => {});
        motion.playing = true;
        motion.lastVideoTime = undefined;
        setActive(sign < 0, motion.justReversed);
        motion.justReversed = false;
      }
      videoTime = sign > 0 ? vid.currentTime : revTime(vid.currentTime);

      // Stall guard: force this leg to complete if videoTime stops
      // advancing (stalled buffering, failed seek, etc.) instead of
      // blocking input forever.
      if (motion.lastVideoTime === undefined || Math.abs(videoTime - motion.lastVideoTime) > 0.02) {
        motion.lastVideoTime = videoTime;
        motion.lastProgress = now;
      } else if (now - motion.lastProgress > STALL_MS) {
        videoTime = subTarget;
      }
    }

    const reached = alreadyThere || (sign > 0
      ? (videoTime >= subTarget - 0.03 || vid.ended)
      : (videoTime <= subTarget + 0.03 || vid.ended));

    if (reached) {
      vid.pause();
      videoTime = subTarget;
      arriveAt(motion.targetCPIndex, sign);
    }
  }

  function tick(now) {
    try {
      if (motion) handleMotion(now);
      else if (!paused && now - lastInputTime > IDLE_MS) accumulator = 0;
    } catch (err) {
      console.error('tick error, resetting motion state:', err);
      motion = null;
    }
    updateProgress();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    registerInput(e.deltaY, performance.now());
  }, { passive: false });

  let touchLastY = null;
  window.addEventListener('touchstart', (e) => {
    touchLastY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (touchLastY === null) return;
    const y = e.touches[0].clientY;
    const delta = (touchLastY - y) * TOUCH_MULTIPLIER;
    touchLastY = y;
    e.preventDefault();
    registerInput(delta, performance.now());
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    const now = performance.now();
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') registerInput(80, now);
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') registerInput(-80, now);
  });
</script>

</body>
</html>
