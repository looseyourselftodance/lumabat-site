<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUMABAT — Construire l'Exception</title>
  <meta name="description" content="LUMABAT — Construction de maisons d'exception à Toulouse. Construire l'Exception." />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark: #1A1A1A;
      --bronze-light: #C4A882;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--dark);
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .clip {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.9);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .clip.active { opacity: 1; z-index: 2; }

    .progress-track {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 2px; background: rgba(248,247,244,0.12);
      z-index: 50;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: var(--bronze-light);
    }

    .loading-label {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      font-family: sans-serif;
      font-size: 0.72rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: rgba(248,247,244,0.55);
      transition: opacity 0.4s ease;
    }

    /* ── Checkpoint caption (placeholder copy — draft pass) ── */
    .checkpoint-text {
      position: fixed; left: 50%; bottom: 14%;
      transform: translate(-50%, 16px);
      z-index: 60; text-align: center;
      max-width: 620px; width: 84%;
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .checkpoint-text.visible { opacity: 1; transform: translate(-50%, 0); }
    .checkpoint-text .cp-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--bronze-light); margin-bottom: 0.9rem;
    }
    .checkpoint-text .cp-body {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.3rem, 3vw, 2.1rem);
      font-weight: 300; line-height: 1.4;
      color: #F8F7F4;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }
    .checkpoint-text .cp-hint {
      margin-top: 1.6rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: rgba(248,247,244,0.4);
    }
  </style>
</head>
<body>

<div id="stage">
  <video class="clip active" data-index="0" src="videos/01.mp4" muted playsinline preload="auto"></video>
  <video class="clip" data-index="1" src="videos/02.mp4" muted playsinline preload="metadata"></video>
  <video class="clip" data-index="2" src="videos/03.mp4" muted playsinline preload="metadata"></video>
  <video class="clip" data-index="3" src="videos/04.mp4" muted playsinline preload="metadata"></video>
  <video class="clip" data-index="4" src="videos/05.mp4" muted playsinline preload="metadata"></video>
  <video class="clip" data-index="5" src="videos/06.mp4" muted playsinline preload="metadata"></video>
  <video class="clip" data-index="6" src="videos/07.mp4" muted playsinline preload="metadata"></video>
  <video class="clip" data-index="7" src="videos/08.mp4" muted playsinline preload="metadata"></video>
  <video class="clip" data-index="8" src="videos/09.mp4" muted playsinline preload="metadata"></video>
  <video class="clip" data-index="9" src="videos/10.mp4" muted playsinline preload="metadata"></video>
  <video class="clip" data-index="10" src="videos/11.mp4" muted playsinline preload="metadata"></video>
</div>
<div class="loading-label" id="loadingLabel">Loading…</div>
<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
<div class="checkpoint-text" id="checkpointText">
  <div class="cp-label" id="cpLabel"></div>
  <div class="cp-body" id="cpBody"></div>
  <div class="cp-hint">scroll to continue</div>
</div>

<script>
  // ── Real-video trigger-and-play engine ──
  // The page opens paused on clip 1's first frame — a film waiting to be
  // played. Scroll input never moves anything directly; it just
  // accumulates. Once enough has accumulated (TRIGGER_THRESHOLD — "one good
  // scroll"), it commits: plays straight through to the end of the current
  // checkpoint using the browser's own native video playback (true smooth,
  // matching the source mp4s), with no further input required. Arriving at
  // a checkpoint boundary pauses the engine and shows that checkpoint's
  // caption; any scroll dismisses it and moves to the next/previous clip.
  //
  // Forward playback uses real video.play() — native decode, native
  // smoothness. Backward has no browser equivalent (no reverse playback),
  // so it's driven by rapid seeking instead — smooth in spirit, but seek
  // performance depends on the browser/clip.

  // `cost` is the scroll-effort budget in SUS — independent of duration.
  // Defaults to `duration` (neutral pacing) until real per-scene pacing is
  // authored later. cost > duration -> plays slower (linger); cost <
  // duration -> plays faster (breeze through). Applied via playbackRate.
  const CLIPS = [
    { file: 'videos/01.mp4', duration: 10, cost: 10 },
    { file: 'videos/02.mp4', duration: 20, cost: 20 },
    { file: 'videos/03.mp4', duration: 20, cost: 20 },
    { file: 'videos/04.mp4', duration: 1,  cost: 1 },
    { file: 'videos/05.mp4', duration: 20, cost: 20 },
    { file: 'videos/06.mp4', duration: 1,  cost: 1 },
    { file: 'videos/07.mp4', duration: 8,  cost: 8 },
    { file: 'videos/08.mp4', duration: 8,  cost: 8 },
    { file: 'videos/09.mp4', duration: 10, cost: 10 },
    { file: 'videos/10.mp4', duration: 1,  cost: 1 },
    { file: 'videos/11.mp4', duration: 15, cost: 15 },
  ];
  const TOTAL_DURATION = CLIPS.reduce((s, c) => s + c.duration, 0);

  // Placeholder captions, one per checkpoint — drafted from what's actually
  // in each clip. Meant to be replaced/adjusted, not final copy.
  const CHECKPOINT_TEXT = [
    { label: '01 — L’Arrivée',        body: 'Une terrasse pensée pour l’heure dorée.' },
    { label: '02 — La Piscine',       body: 'Là où la cuisine extérieure rencontre l’eau.' },
    { label: '03 — Le Séjour',        body: 'Ouvert, lumineux, pensé pour se retrouver.' },
    { label: '04 — La Buanderie',     body: 'Chaque détail compte, jusqu’à la buanderie.' },
    { label: '05 — Le Garage',        body: 'Stationnement couvert, à deux pas de la cuisine.' },
    { label: '06 — La Cuisine',       body: 'Là où la maison prend vie.' },
    { label: '07 — Le Couloir',       body: 'Un passage calme vers la salle de bain.' },
    { label: '08 — La Salle de Bain', body: 'Douche pluie, lumière naturelle, aucun compromis.' },
    { label: '09 — La Chambre',       body: 'Le repos, encadré de verre et de verdure.' },
    { label: '10 — Le Bureau',        body: 'Un coin tranquille pour travailler chez soi.' },
    { label: '11 — Le Retour',        body: 'De retour au point de départ — la piscine, au crépuscule.' },
  ];

  // How much accumulated scroll (px) is needed to trigger a checkpoint —
  // "one good scroll" — tuned to roughly two or three normal wheel notches.
  // Once triggered, it plays all the way to the next checkpoint with no
  // further input needed.
  const TRIGGER_THRESHOLD = 260;
  const TOUCH_MULTIPLIER = 2.2;
  // If no scroll/touch event arrives for this long, we're no longer
  // "actively scrolling" — a leftover accumulator that never reached
  // threshold gets cleared rather than firing much later.
  const IDLE_MS = 150;
  // How fast backward seeking steps through the clip, in seconds of
  // footage per second of real time (scaled by cp.scale on top of this).
  const REVERSE_RATE = 1;

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  const stage = document.getElementById('stage');
  const videos = Array.from(document.querySelectorAll('.clip'));
  const loadingLabel = document.getElementById('loadingLabel');
  const progressFill = document.getElementById('progressFill');
  const checkpointTextEl = document.getElementById('checkpointText');
  const cpLabelEl = document.getElementById('cpLabel');
  const cpBodyEl = document.getElementById('cpBody');

  videos.forEach((v) => { v.playsInline = true; });

  let ready = false;
  videos[0].addEventListener('loadeddata', () => {
    if (ready) return;
    ready = true;
    loadingLabel.style.opacity = '0';
  }, { once: true });

  function elapsedBefore(idx) {
    let s = 0;
    for (let i = 0; i < idx; i++) s += CLIPS[i].duration;
    return s;
  }

  function updateProgress() {
    const elapsed = elapsedBefore(activeIndex) + videoTime;
    progressFill.style.width = (elapsed / TOTAL_DURATION * 100) + '%';
  }

  function setActive(idx) {
    videos.forEach((v, i) => v.classList.toggle('active', i === idx));
  }

  let activeIndex = 0;
  let videoTime = 0; // seconds within the active clip
  let accumulator = 0;
  let pendingSign = 0;
  let lastInputTime = 0;
  let burst = null; // { target, sign } while a checkpoint is playing through
  let paused = false;
  let lastTickTime = null;

  function enterPause(idx) {
    paused = true;
    accumulator = 0;
    const t = CHECKPOINT_TEXT[idx];
    cpLabelEl.textContent = t.label;
    cpBodyEl.textContent = t.body;
    checkpointTextEl.classList.add('visible');
    // Prime whichever clip we might head into next while the caption is up.
    const next = videos[idx + 1];
    if (next) next.preload = 'auto';
    const prev = videos[idx - 1];
    if (prev) prev.preload = 'auto';
  }

  function exitPause(dismissSign) {
    paused = false;
    accumulator = 0;
    checkpointTextEl.classList.remove('visible');
    if (dismissSign > 0 && activeIndex < CLIPS.length - 1) {
      activeIndex++;
      videoTime = 0;
      videos[activeIndex].currentTime = 0;
      setActive(activeIndex);
    } else if (dismissSign < 0 && activeIndex > 0) {
      activeIndex--;
      videoTime = CLIPS[activeIndex].duration;
      videos[activeIndex].currentTime = videoTime;
      setActive(activeIndex);
    }
  }

  function registerInput(deltaPxLike, now) {
    if (deltaPxLike === 0) return;
    const sign = Math.sign(deltaPxLike);
    lastInputTime = now;
    if (paused) { exitPause(sign); return; }
    if (pendingSign !== 0 && sign !== pendingSign) accumulator = 0; // direction reversed before firing
    pendingSign = sign;
    accumulator += Math.abs(deltaPxLike);
    maybeStartBurst();
  }

  function maybeStartBurst() {
    if (burst || paused || accumulator < TRIGGER_THRESHOLD || pendingSign === 0) return;
    accumulator = 0;
    const cp = CLIPS[activeIndex];
    const vid = videos[activeIndex];
    const scale = clamp(cp.duration / cp.cost, 0.25, 4);
    const target = pendingSign > 0 ? cp.duration : 0;
    burst = { target, sign: pendingSign };
    if (pendingSign > 0) {
      vid.currentTime = videoTime;
      vid.playbackRate = scale;
      vid.play().catch(() => {});
    } else {
      vid.pause();
    }
  }

  function tick(now) {
    if (lastTickTime == null) lastTickTime = now;
    const dt = clamp((now - lastTickTime) / 1000, 0, 0.1);
    lastTickTime = now;

    if (burst) {
      const cp = CLIPS[activeIndex];
      const vid = videos[activeIndex];
      const scale = clamp(cp.duration / cp.cost, 0.25, 4);
      if (burst.sign > 0) {
        videoTime = vid.currentTime;
      } else {
        videoTime = clamp(videoTime - dt * REVERSE_RATE * scale, 0, cp.duration);
        vid.currentTime = videoTime;
      }
      const reached = burst.sign > 0
        ? (videoTime >= burst.target - 0.03 || vid.ended)
        : videoTime <= burst.target + 0.01;
      if (reached) {
        vid.pause();
        videoTime = burst.target;
        vid.currentTime = videoTime;
        burst = null;
        if (videoTime === cp.duration || videoTime === 0) {
          enterPause(activeIndex);
        }
      }
    } else if (!paused && now - lastInputTime > IDLE_MS) {
      accumulator = 0;
    }

    updateProgress();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    registerInput(e.deltaY, performance.now());
  }, { passive: false });

  let touchLastY = null;
  window.addEventListener('touchstart', (e) => {
    touchLastY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    if (touchLastY === null) return;
    const y = e.touches[0].clientY;
    const delta = (touchLastY - y) * TOUCH_MULTIPLIER;
    touchLastY = y;
    e.preventDefault();
    registerInput(delta, performance.now());
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    const now = performance.now();
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') registerInput(80, now);
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') registerInput(-80, now);
  });
</script>

</body>
</html>
